<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<meta name="description" content="LEO Elevators - Luxury Home, Villa, Commercial, Hospital, and Panoramic Elevators across Jaipur, Gurugram, and Narnaul.">
<title>LEO Elevators | Luxury Vertical Mobility & Engineering</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root {
  --navy: #04122d;
  --navy2: #092355;
  --blue: #1556d6;
  --blue2: #2f7bff;
  --sky: #6db6ff;
  --ice: #edf4ff;
  --ice2: #d8e6fd;
  --white: #ffffff;
  --ink: #0b1a38;
  --muted: #5e6f92;
  --line: #d8e4f8;
  --ok: #10b981;
  --warn: #f59e0b;
  --danger: #ef4444;
  --glass-bg: rgba(255, 255, 255, 0.72);
  --glass-border: rgba(255, 255, 255, 0.9);
  --shadow: 0 20px 45px -18px rgba(21, 86, 214, 0.35);
  --shadow-lg: 0 28px 60px -20px rgba(4, 18, 45, 0.45);
  --serif: 'Playfair Display', Georgia, serif;
  --sans: 'Manrope', system-ui, -apple-system, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--sans);
  color: var(--ink);
  background: #fbfdff;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  width: 100%;
}
body.lock { overflow: hidden; }
a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; border: 0; background: none; color: inherit; touch-action: manipulation; }
img { max-width: 100%; height: auto; display: block; }
h1, h2, h3, h4 { font-family: var(--serif); line-height: 1.18; letter-spacing: -0.015em; }

.container { max-width: 1220px; margin: 0 auto; padding: 0 20px; }
.eyebrow {
  display: inline-block;
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--blue);
  background: var(--ice);
  border: 1px solid var(--line);
  padding: 0.45rem 1.1rem;
  border-radius: 99px;
}
.grad-text {
  background: linear-gradient(90deg, var(--blue), var(--sky));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.em { font-style: italic; font-weight: 500; }
.sec { padding: 90px 0; position: relative; }
.sec.alt { background: linear-gradient(180deg, #f4f8ff 0%, #edf4ff 100%); }
.head { text-align: center; max-width: 760px; margin: 0 auto 50px; }
.head h2 { font-size: clamp(1.9rem, 4.4vw, 3.2rem); margin: 16px 0 14px; }
.head p { color: var(--muted); font-size: 1.02rem; }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.65rem;
  padding: 0.95rem 1.85rem;
  border-radius: 99px;
  font-weight: 700;
  font-size: 0.92rem;
  transition: all 0.25s ease;
  touch-action: manipulation;
}
.btn-primary {
  background: linear-gradient(135deg, var(--blue), var(--blue2));
  color: #fff;
  box-shadow: var(--shadow);
}
.btn-primary:hover {
  transform: translateY(-3px);
  box-shadow: 0 24px 50px -16px rgba(21, 86, 214, 0.65);
}
.btn-ghost {
  background: #fff;
  border: 1.5px solid var(--line);
  color: var(--navy2);
}
.btn-ghost:hover {
  border-color: var(--blue);
  color: var(--blue);
  transform: translateY(-2px);
}
.btn-light {
  background: #fff;
  color: var(--navy2);
}
.btn-light:hover {
  transform: translateY(-3px);
  box-shadow: 0 15px 35px -10px rgba(0,0,0,0.25);
}

#progress {
  position: fixed;
  top: 0;
  left: 0;
  height: 3.5px;
  width: 0%;
  background: linear-gradient(90deg, var(--blue), var(--sky), #fff);
  z-index: 9999;
  transition: width 0.1s linear;
}

/* ===== SPLASH INTRO ===== */
#splash {
  position: fixed;
  inset: 0;
  z-index: 99999;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #030d20;
}
.sp-door {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 50%;
  background: linear-gradient(160deg, #092355, #030d20 70%);
  transition: transform 1s cubic-bezier(0.77, 0, 0.18, 1);
  overflow: hidden;
}
.sp-door::after {
  content: "";
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(90deg, transparent 0 36px, rgba(109, 182, 255, 0.05) 36px 37px);
}
.sp-l { left: 0; border-right: 2px solid rgba(109, 182, 255, 0.4); }
.sp-r { right: 0; border-left: 2px solid rgba(109, 182, 255, 0.4); }
#splash.open .sp-l { transform: translateX(-100%); }
#splash.open .sp-r { transform: translateX(100%); }
.sp-center {
  position: relative;
  z-index: 3;
  text-align: center;
  color: #fff;
  transition: opacity 0.4s ease, transform 0.6s ease;
}
#splash.open .sp-center { opacity: 0; transform: scale(1.1); }
.sp-mark {
  width: 76px;
  height: 76px;
  margin: 0 auto 18px;
  border-radius: 22px;
  background: linear-gradient(135deg, var(--blue), var(--sky));
  display: grid;
  place-items: center;
  font-size: 2.2rem;
  box-shadow: 0 0 50px rgba(47, 123, 255, 0.7);
  animation: spPulse 1.8s infinite ease-in-out;
}
@keyframes spPulse { 50% { transform: scale(1.08); box-shadow: 0 0 80px rgba(109, 182, 255, 0.9); } }
.sp-title {
  font-family: var(--serif);
  font-size: clamp(2.6rem, 8vw, 4.6rem);
  font-weight: 700;
  letter-spacing: 0.14em;
}
.sp-sub {
  font-size: 0.8rem;
  letter-spacing: 0.55em;
  text-transform: uppercase;
  color: var(--sky);
  margin-top: 6px;
}
.sp-floor { margin: 26px auto 0; width: min(280px, 70vw); }
.sp-bar { height: 5px; background: rgba(255, 255, 255, 0.15); border-radius: 9px; overflow: hidden; }
.sp-bar i {
  display: block;
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, var(--blue2), var(--sky), #fff);
  box-shadow: 0 0 14px var(--sky);
  transition: width 0.08s linear;
}
.sp-row {
  display: flex;
  justify-content: space-between;
  font-size: 0.74rem;
  letter-spacing: 0.2em;
  color: var(--sky);
  margin-top: 10px;
  font-weight: 700;
}
.sp-skip {
  position: absolute;
  z-index: 5;
  bottom: 24px;
  right: 24px;
  color: #fff;
  border: 1px solid rgba(255, 255, 255, 0.35);
  padding: 0.6rem 1.3rem;
  border-radius: 99px;
  font-size: 0.75rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  transition: 0.2s;
}
.sp-skip:hover { background: #fff; color: var(--navy); }

/* ===== HEADER ===== */
header {
  position: sticky;
  top: 0;
  z-index: 1000;
  padding: 12px 0;
  background: rgba(255, 255, 255, 0.92);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--line);
}
.nav { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.logo { display: flex; align-items: center; gap: 12px; }
.logo-mark {
  width: 42px;
  height: 42px;
  border-radius: 13px;
  background: linear-gradient(135deg, var(--blue), var(--sky));
  display: grid;
  place-items: center;
  color: #fff;
  font-size: 1.2rem;
  box-shadow: var(--shadow);
}
.logo-text { font-family: var(--serif); font-weight: 800; font-size: 1.45rem; letter-spacing: 0.08em; color: var(--navy); line-height: 1; }
.logo-text small { display: block; font-family: var(--sans); font-size: 0.55rem; font-weight: 700; letter-spacing: 0.45em; color: var(--blue); margin-top: 2px; }
.links { display: none; gap: 4px; align-items: center; }
.links a {
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--muted);
  padding: 0.5rem 0.85rem;
  border-radius: 99px;
  transition: 0.2s;
}
.links a:hover { color: var(--blue); background: var(--ice); }
.links a.active { color: #fff; background: var(--blue); }
.burger { width: 44px; height: 44px; border-radius: 12px; background: var(--ice); color: var(--blue); font-size: 1.25rem; display: flex; align-items: center; justify-content: center; }
#mmenu { display: none; padding: 14px 0 10px; }
#mmenu.show { display: grid; gap: 6px; }
#mmenu a { padding: 0.8rem 1rem; border-radius: 14px; font-weight: 600; color: var(--ink); background: #f8fbff; font-size: 0.92rem; }
#mmenu a.active { background: var(--ice); color: var(--blue); font-weight: 700; }
@media(min-width: 1040px) {
  .links { display: flex; }
  .burger { display: none; }
  #mmenu { display: none !important; }
}

/* ===== HERO SECTION ===== */
.hero {
  position: relative;
  background: linear-gradient(135deg, var(--navy) 0%, var(--navy2) 55%, #0f47b8 100%);
  color: #fff;
  overflow: hidden;
  padding: 70px 0 95px;
}
.hero::before {
  content: "";
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(90deg, transparent 0 60px, rgba(255,255,255,.03) 60px 61px),
              repeating-linear-gradient(0deg, transparent 0 60px, rgba(255,255,255,.03) 60px 61px);
}
.orb { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.45; animation: drift 12s ease-in-out infinite; }
.orb.o1 { width: 380px; height: 380px; background: #2f7bff; top: -100px; left: -80px; }
.orb.o2 { width: 320px; height: 320px; background: #6db6ff; bottom: -120px; right: 8%; animation-delay: -5s; }
@keyframes drift { 50% { transform: translate(30px, 20px); } }

.hero-grid { position: relative; display: grid; gap: 40px; align-items: center; }
@media(min-width: 960px) { .hero-grid { grid-template-columns: 1.15fr 0.85fr; } }
.hero h1 { font-size: clamp(2.4rem, 5.5vw, 4.2rem); margin: 20px 0 18px; font-weight: 700; }
.hero p.lead { color: #c9dcff; font-size: 1.08rem; max-width: 560px; line-height: 1.65; }
.hero-btns { display: flex; flex-wrap: wrap; gap: 12px; margin: 30px 0; }
.trust { display: flex; flex-wrap: wrap; gap: 16px; font-size: 0.84rem; color: #bcd3ff; border-top: 1px solid rgba(255,255,255,.15); padding-top: 20px; }
.trust i { color: var(--sky); margin-right: 6px; }

.shaft-wrap { position: relative; max-width: 340px; margin: 0 auto; width: 100%; }
.shaft-mini {
  position: relative;
  height: 420px;
  border-radius: 30px;
  background: linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,.04));
  border: 1px solid rgba(255,255,255,.25);
  overflow: hidden;
  box-shadow: 0 40px 80px -30px rgba(0,0,0,.6);
}
.shaft-mini::before {
  content: "";
  position: absolute;
  left: 50%;
  top: 0;
  bottom: 0;
  width: 2px;
  background: rgba(255,255,255,.2);
  transform: translateX(-50%);
}
.mini-fl {
  position: absolute;
  left: 14px;
  right: 14px;
  border-top: 1px dashed rgba(255,255,255,.2);
  font-size: 0.64rem;
  color: #a4c9ff;
  letter-spacing: 0.1em;
}
.mini-car {
  position: absolute;
  left: 50%;
  width: 120px;
  height: 100px;
  margin-left: -60px;
  border-radius: 16px;
  background: linear-gradient(180deg, #fff, #dbe9ff);
  border: 3px solid var(--sky);
  box-shadow: 0 0 40px rgba(109, 182, 255, 0.75);
  animation: rideMini 10s ease-in-out infinite;
  overflow: hidden;
  display: flex;
}
@keyframes rideMini {
  0%, 12% { bottom: 20px; }
  45%, 58% { bottom: 300px; }
  88%, 100% { bottom: 20px; }
}
.mini-car i { position: absolute; inset: 0; display: grid; place-items: center; color: var(--blue); font-size: 1.5rem; }
.mini-car b { position: relative; z-index: 2; flex: 1; background: linear-gradient(180deg, #2f7bff, #0a2a63); }
.mini-car b:first-of-type { animation: dlM 10s ease-in-out infinite; }
.mini-car b:last-of-type { animation: drM 10s ease-in-out infinite; }
@keyframes dlM { 0%, 12% { transform: translateX(-95%); } 18%, 39% { transform: none; } 45%, 58% { transform: translateX(-95%); } 64%, 82% { transform: none; } 88%, 100% { transform: translateX(-95%); } }
@keyframes drM { 0%, 12% { transform: translateX(95%); } 18%, 39% { transform: none; } 45%, 58% { transform: translateX(95%); } 64%, 82% { transform: none; } 88%, 100% { transform: translateX(95%); } }

.chip {
  position: absolute;
  background: #fff;
  color: var(--ink);
  padding: 0.65rem 1rem;
  border-radius: 16px;
  box-shadow: var(--shadow);
  font-size: 0.78rem;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 0.55rem;
  animation: floatChip 6s ease-in-out infinite;
}
.chip i { color: var(--blue); }
.chip.c1 { top: 40px; left: -22px; }
.chip.c2 { bottom: 55px; right: -18px; animation-delay: -3s; }
@keyframes floatChip { 50% { transform: translateY(-10px); } }

/* Marquee */
.marquee { background: var(--blue); color: #fff; overflow: hidden; white-space: nowrap; padding: 14px 0; }
.marquee-track { display: inline-flex; gap: 36px; animation: scrollMarquee 32s linear infinite; }
.marquee:hover .marquee-track { animation-play-state: paused; }
.marquee span { font-family: var(--serif); font-size: 1.1rem; font-style: italic; display: inline-flex; align-items: center; gap: 36px; }
.marquee span::after { content: "✦"; font-style: normal; color: var(--sky); font-size: 0.8rem; }
@keyframes scrollMarquee { to { transform: translateX(-50%); } }

/* Boutique Stats Section */
.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-top: -45px; position: relative; z-index: 5; }
@media(min-width: 800px) { .stats { grid-template-columns: repeat(4, 1fr); gap: 18px; } }
.stat {
  background: rgba(255, 255, 255, 0.96);
  backdrop-filter: blur(14px);
  border: 1.5px solid var(--line);
  border-radius: 24px;
  padding: 22px 1
